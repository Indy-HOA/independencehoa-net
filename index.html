<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Independence HOA – Sussex County, Delaware</title>
  <meta name="robots" content="noindex">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #222;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background: #fff;
      max-width: 560px;
      width: 100%;
      padding: 40px 32px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 { font-size: 1.6rem; margin: 0 0 16px; }
    p { font-size: 1.1rem; line-height: 1.5; margin: 0 0 24px; }
    .address {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a5fa8;
      margin: 0 0 24px;
    }
    a.button {
      display: inline-block;
      background: #1a5fa8;
      color: #fff;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 1.1rem;
    }
    a.button:hover { background: #154c87; }
  </style>
</head>
<body>
  <div class="card">
    <h1>The website IndependenceHOA.net has been retired</h1>
    <p>The Independence Homeowners Association, located in Sussex County, Delaware, has a new community website. Please update your bookmarks to:</p>
    <div class="address">IndyHOA.net</div>
    <a class="button" href="https://engage.goenumerate.com/s/independence/">Go to the Independence HOA Community website</a>
  </div>
</body>
</html>
